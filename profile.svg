<desc id="desc">Developer based in Moscow with 3+ years of experience. Focused on high-load systems, data science and scalable architecture. Python, SQL, Java and React. Open for opportunities. Full technology stack and contact details below.</desc>
<style>
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
