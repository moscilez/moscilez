.card:hover rect,.card:focus-visible rect{stroke:#0b6e97}
a text{transition:fill .25s,transform .25s;transform-box:fill-box;transform-origin:center}
a:hover text,a:focus-visible text{fill:#cbe538;transform:translateY(-3px)}
a:focus-visible{outline:2px solid #cbe538}
.tool-row rect{fill:#eeece5;opacity:0;transition:opacity .25s}
.tool-row:hover rect{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
